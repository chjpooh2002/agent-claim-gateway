name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: 린트
        run: uv run ruff check .
      - name: 포맷 검사
        run: uv run ruff format --check .
      - name: 테스트
        run: uv run pytest
