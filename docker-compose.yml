services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: claim_gateway
      MYSQL_USER: claim
      MYSQL_PASSWORD: claim
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  mall-a:
    build: .
    command: uvicorn mock_malls.mall_a.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  mall-b:
    build: .
    command: uvicorn mock_malls.mall_b.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"

  app:
    build: .
    command: uvicorn claim_gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: mysql://claim:claim@db:3306/claim_gateway
      MALL_A_BASE_URL: http://mall-a:8001
      MALL_B_BASE_URL: http://mall-b:8002
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mall-a:
        condition: service_started
      mall-b:
        condition: service_started
